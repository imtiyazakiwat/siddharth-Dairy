name: Build & Deploy Flutter Web

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siddharth_dairy
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      # Keep the build downloadable from the workflow run
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: siddharth_dairy/build/web

      # Deploy as prebuilt static output (bypasses the project's Root Directory/build settings)
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NfMsAg3uQAA6uPb4B4M62U3E
          VERCEL_PROJECT_ID: prj_AiTChl8uYd6gtbfYSCC3RmzJ7S1P
        run: |
          mkdir -p .vercel/output/static
          cp -r build/web/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
